<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">От действия к завершению</title><desc id="desc">Сервер — источник истины. Клиент показывает результат только из нового SessionView.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#859bab"/></marker></defs><rect width="1100" height="555" rx="18" fill="#f2f6f8"/><g font-family="DejaVu Sans,Arial,sans-serif"><polyline points="330,115 400,115" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="690,115 760,115" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="905,180 905,355" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="848" y="248.5" width="114" height="24" rx="5" fill="#f2f6f8"/><text x="905" y="264.5" text-anchor="middle" font-size="12" fill="#405968">если допустимо</text><polyline points="760,420 690,420" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="696" y="401" width="58" height="24" rx="5" fill="#f2f6f8"/><text x="725" y="417" text-anchor="middle" font-size="12" fill="#405968">commit</text><polyline points="400,420 330,420" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="343" y="401" width="44" height="24" rx="5" fill="#f2f6f8"/><text x="365" y="417" text-anchor="middle" font-size="12" fill="#405968">view</text><g><rect x="40" y="50" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="40" y="65" width="4" height="36" rx="2" fill="#e1844a"/><text x="60" y="85" fill="#132c3b" font-size="18" font-weight="bold">01 / Начало</text><text x="60" y="116" fill="#536877" font-size="14">POST /sessions</text><text x="60" y="139" fill="#536877" font-size="14">Снимок опубликованного графа</text></g><g><rect x="400" y="50" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="400" y="65" width="4" height="36" rx="2" fill="#087f8c"/><text x="420" y="85" fill="#132c3b" font-size="18" font-weight="bold">02 / Действие</text><text x="420" y="116" fill="#536877" font-size="14">answer · world-action · turn</text><text x="420" y="139" fill="#536877" font-size="14">requestId + expectedVersion</text></g><g><rect x="760" y="50" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="760" y="65" width="4" height="36" rx="2" fill="#087f8c"/><text x="780" y="85" fill="#132c3b" font-size="18" font-weight="bold">03 / Проверки</text><text x="780" y="116" fill="#536877" font-size="14">Версия · дедлайн · дистанция</text><text x="780" y="139" fill="#536877" font-size="14">Инвентарь и допустимые действия</text></g><g><rect x="40" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="40" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="60" y="390" fill="#132c3b" font-size="18" font-weight="bold">06 / Видимый результат</text><text x="60" y="421" fill="#536877" font-size="14">world + commandFeedback</text><text x="60" y="444" fill="#536877" font-size="14">course → следующий этап / итог</text></g><g><rect x="400" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="400" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="420" y="390" fill="#132c3b" font-size="18" font-weight="bold">05 / Сохранение</text><text x="420" y="421" fill="#536877" font-size="14">state + version + commands</text><text x="420" y="444" fill="#536877" font-size="14">Финал: results + outbox</text></g><g><rect x="760" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="760" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="780" y="390" fill="#132c3b" font-size="18" font-weight="bold">04 / Переход движка</text><text x="780" y="421" fill="#536877" font-size="14">Применить эффекты и условия</text><text x="780" y="444" fill="#536877" font-size="14">Следующий узел / дочерний граф</text></g></g></svg>