<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">Запуск и границы окружения</title><desc id="desc">Локальная схема проекта. Docker Compose — альтернативный способ запуска, не проверка production.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#859bab"/></marker></defs><rect width="1100" height="555" rx="18" fill="#f2f6f8"/><g font-family="DejaVu Sans,Arial,sans-serif"><polyline points="330,120 400,120" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="343" y="101" width="44" height="24" rx="5" fill="#f2f6f8"/><text x="365" y="117" text-anchor="middle" font-size="12" fill="#405968">HTTP</text><polyline points="690,120 760,120" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="703" y="101" width="44" height="24" rx="5" fill="#f2f6f8"/><text x="725" y="117" text-anchor="middle" font-size="12" fill="#405968">HTTP</text><polyline points="905,185 545,350" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="706.5" y="248.5" width="37" height="24" rx="5" fill="#f2f6f8"/><text x="725" y="264.5" text-anchor="middle" font-size="12" fill="#405968">SQL</text><polyline points="760,415 690,415" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="706.5" y="396" width="37" height="24" rx="5" fill="#f2f6f8"/><text x="725" y="412" text-anchor="middle" font-size="12" fill="#405968">SQL</text><polyline points="185,480 180,250 900,250 905,55" fill="none" stroke="#859bab" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="490" y="231" width="100" height="24" rx="5" fill="#f2f6f8"/><text x="540" y="247" text-anchor="middle" font-size="12" fill="#405968">конфигурация</text><g><rect x="40" y="55" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="40" y="70" width="4" height="36" rx="2" fill="#e1844a"/><text x="60" y="90" fill="#132c3b" font-size="18" font-weight="bold">Браузер</text><text x="60" y="121" fill="#536877" font-size="14">localhost:5180</text><text x="60" y="144" fill="#536877" font-size="14">Игра · /api/docs</text></g><g><rect x="400" y="55" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="400" y="70" width="4" height="36" rx="2" fill="#087f8c"/><text x="420" y="90" fill="#132c3b" font-size="18" font-weight="bold">Web / Vite proxy</text><text x="420" y="121" fill="#536877" font-size="14">Статика и интерфейс</text><text x="420" y="144" fill="#536877" font-size="14">/api → API_PROXY_TARGET</text></g><g><rect x="760" y="55" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="760" y="70" width="4" height="36" rx="2" fill="#087f8c"/><text x="780" y="90" fill="#132c3b" font-size="18" font-weight="bold">API / Node.js ≥ 22.12</text><text x="780" y="121" fill="#536877" font-size="14">PORT из .env</text><text x="780" y="144" fill="#536877" font-size="14">По умолчанию 4180</text></g><g><rect x="40" y="350" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="40" y="365" width="4" height="36" rx="2" fill="#087f8c"/><text x="60" y="385" fill="#132c3b" font-size="18" font-weight="bold">Серверное окружение</text><text x="60" y="416" fill="#536877" font-size="14">DATABASE_URL · WEB_ORIGIN</text><text x="60" y="439" fill="#536877" font-size="14">YANDEX_* · VAPID_*</text></g><g><rect x="400" y="350" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="400" y="365" width="4" height="36" rx="2" fill="#087f8c"/><text x="420" y="385" fill="#132c3b" font-size="18" font-weight="bold">PostgreSQL</text><text x="420" y="416" fill="#536877" font-size="14">Локально 127.0.0.1:55432</text><text x="420" y="439" fill="#536877" font-size="14">Docker: db:5432 + volume</text></g><g><rect x="760" y="350" width="290" height="130" rx="14" fill="white" 