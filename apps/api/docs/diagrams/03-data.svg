d="url(#arrow)"/><rect x="709.5" y="401" width="51" height="24" rx="5" fill="#f2f6f8"/><text x="735" y="417" text-anchor="middle" font-size="12" fill="#405968">event</text><g><rect x="35" y="45" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="35" y="60" width="4" height="36" rx="2" fill="#e1844a"/><text x="55" y="80" fill="#132c3b" font-size="18" font-weight="bold">users</text><text x="55" y="111" fill="#536877" font-size="14">id · роль · профиль</text><text x="55" y="134" fill="#536877" font-size="14">auth_sessions / user_avatars</text></g><g><rect x="405" y="45" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="405" y="60" width="4" height="36" rx="2" fill="#087f8c"/><text x="425" y="80" fill="#132c3b" font-size="18" font-weight="bold">scenarios</text><text x="425" y="111" fill="#536877" font-size="14">owner_id · draft · revision</text><text x="425" y="134" fill="#536877" font-size="14">scenario_versions: (id, version)</text></g><g><rect x="775" y="45" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="775" y="60" width="4" height="36" rx="2" fill="#087f8c"/><text x="795" y="80" fill="#132c3b" font-size="18" font-weight="bold">game_sessions</text><text x="795" y="111" fill="#536877" font-size="14">user_id · scenario_id · state</text><text x="795" y="134" fill="#536877" font-size="14">Снимок версий · deadline</text></g><g><rect x="35" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="35" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="55" y="390" fill="#132c3b" font-size="18" font-weight="bold">commands / dialogue_*</text><text x="55" y="421" fill="#536877" font-size="14">user + operation + request_id</text><text x="55" y="444" fill="#536877" font-size="14">Реплики · jobs · speech cache</text></g><g><rect x="405" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="405" y="370" width="4" height="36" rx="2" fill="#087f8c"/><t