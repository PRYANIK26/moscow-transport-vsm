<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">ИИ и голос</title><desc id="desc">Помощник предлагает изменения, пользователь применяет их. Речь и игровое действие — разные шаги.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#859bab"/></marker></defs><rect width="1100" height="555" rx="18" fill="#f2f6f8"/><g font-family="DejaVu Sans,Arial,sans-serif"><polyline points="330,110 400,110" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="690,110 760,110" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="703" y="91" width="44" height="24" rx="5" fill="#f2f6f8"/><text x="725" y="107" text-anchor="middle" font-size="12" fill="#405968">план</text><polyline points="330,420 400,420" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="339.5" y="401" width="51" height="24" rx="5" fill="#f2f6f8"/><text x="365" y="417" text-anchor="middle" font-size="12" fill="#405968">текст</text><polyline points="690,420 760,420" fill="none" stroke="#859bab" stroke-width="2"  marker-end="url(#arrow)"/><rect x="703" y="401" width="44" height="24" rx="5" fill="#f2f6f8"/><text x="725" y="417" text-anchor="middle" font-size="12" fill="#405968">poll</text><g><rect x="40" y="45" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="40" y="60" width="4" height="36" rx="2" fill="#e1844a"/><text x="60" y="80" fill="#132c3b" font-size="18" font-weight="bold">Автор / описание</text><text x="60" y="111" fill="#536877" font-size="14">POST .../assistant</text><text x="60" y="134" fill="#536877" font-size="14">Режим scenario или scene</text></g><g><rect x="400" y="45" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="400" y="60" width="4" height="36" rx="2" fill="#087f8c"/><text x="420" y="80" fill="#132c3b" font-size="18" font-weight="bold">Yandex → план → проверка</text><text x="420" y="111" fill="#536877" font-size="14">Строгая схема ответа</text><text x="420" y="134" fill="#536877" font-size="14">Компиляция допустимого графа</text></g><g><rect x="760" y="45" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="760" y="60" width="4" height="36" rx="2" fill="#087f8c"/><text x="780" y="80" fill="#132c3b" font-size="18" font-weight="bold">Просмотр → применение</text><text x="780" y="111" fill="#536877" font-size="14">PUT черновика + baseRevision</text><text x="780" y="134" fill="#536877" font-size="14">POST publish отдельно</text></g><g><rect x="40" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="40" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="60" y="390" fill="#132c3b" font-size="18" font-weight="bold">Голос проводника</text><text x="60" y="421" fill="#536877" font-size="14">PCM16LE → POST /voice</text><text x="60" y="444" fill="#536877" font-size="14">SpeechKit STT → текст</text></g><g><rect x="400" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="400" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="420" y="390" fill="#132c3b" font-size="18" font-weight="bold">POST /turn → очередь</text><text x="420" y="421" fill="#536877" font-size="14">Worker: реплика + команда</text><text x="420" y="444" fill="#536877" font-size="14">Проверка доступного действия</text></g><g><rect x="760" y="355" width="290" height="130" rx="14" fill="white" stroke="#cfdae1"/><rect x="760" y="370" width="4" height="36" rx="2" fill="#087f8c"/><text x="780" y="390" fill="#132c3b" font-size="18" font-weight="bold">Ответ и озвучка</text><text x="780" y="421" fill="#536877" font-size="14">GET session → messageId</text><text x="780" y="444" fill="#536877" font-size="14">POST /speech → Ogg Opus</text></g></g></svg>